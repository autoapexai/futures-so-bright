<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no, interactive-widget=overlays-content"
    />
    <meta name="theme-color" content="#0a0015" />
    <meta name="msapplication-TileColor" content="#0a0015" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Future's So Bright" />
    <meta name="application-name" content="Future's So Bright" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Synthwave endless runner — dodge the glare, keep your shades charged." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <title>Future's So Bright — Gotta Wear Shades!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="safe-probe" aria-hidden="true"></div>
    <div id="app">
      <canvas id="game" width="960" height="540" draggable="false" style="touch-action:none"></canvas>
      <div id="touch-hint" aria-hidden="true">Stick · START</div>
      <div id="touch-controls" aria-hidden="true">
        <div id="joy-zone" class="joy-zone" aria-label="Move stick" role="application">
          <div id="joy-base" class="joy-base">
            <div class="joy-ring" aria-hidden="true"></div>
            <div id="joy-knob" class="joy-knob" aria-hidden="true"></div>
          </div>
        </div>
        <button type="button" class="touch-btn touch-action" data-action="boost" aria-label="Start" draggable="false" style="touch-action:none">START</button>
        <button type="button" id="hand-btn" class="hand-btn" aria-label="Left-hand controls" draggable="false" style="touch-action:none" title="Toggle left / right hand controls">LEFT HAND</button>
      </div>
      <div id="diff-ctl" role="group" aria-label="Difficulty 5, points 1.0x">
        <button type="button" id="diff-minus" class="diff-btn" aria-label="Easier" title="Easier ( [ or - )" draggable="false" style="touch-action:none">&minus;</button>
        <span id="diff-label" aria-live="polite"><span id="diff-main">DIFFICULTY 5</span><span class="diff-sep"> · </span><span id="diff-mult">1.0x</span></span>
        <button type="button" id="diff-plus" class="diff-btn" aria-label="Harder" title="Harder ( ] or = )" draggable="false" style="touch-action:none">+</button>
      </div>
      <div id="eleven-fx" aria-hidden="true">
        <div class="fx-backdrop"></div>
        <div class="fx-flare"></div>
        <div class="fx-center">
        <svg class="fx-shades" viewBox="0 0 120 40" width="168" height="56" aria-hidden="true">
          <path d="M4 8 H116 V12 H108 L102 30 Q100 36 92 36 H76 Q68 36 66 30 L62 18 Q60 15 58 18 L54 30 Q52 36 44 36 H28 Q20 36 18 30 L12 12 H4 Z" fill="#0a0015" stroke="#ffe66d" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M22 14 L30 14 L24 28" stroke="rgba(255,255,255,0.55)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M70 14 L78 14 L72 28" stroke="rgba(255,255,255,0.55)" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
          <div class="fx-msg">This one goes to eleven.</div>
        </div>
      </div>
      <div id="congrats" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="congrats-text">
        <div class="cg-card">
          <div class="cg-sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <p id="congrats-text"><span class="cg-l1">Congratulations, you're number one. </span><span class="cg-l2">You have been selected to play difficulty level eleven.</span></p>
          <div class="cg-hint" aria-hidden="true">Tap or press any key</div>
        </div>
      </div>
      <div id="clone-card" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="clone-title" aria-describedby="clone-line">
        <div class="cg-card">
          <div class="cg-sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <p id="clone-text"><span id="clone-title" class="cg-l1">I Think I'm a Clone Now</span><span id="clone-line" class="cg-l2">Level eleven. A tip of the shades to Weird Al Yankovic.</span></p>
          <div class="cg-hint" aria-hidden="true">Tap or press any key</div>
        </div>
      </div>
      <div id="hud-chrome" aria-hidden="true">
        <button type="button" id="pause-btn" aria-label="Pause" draggable="false" style="touch-action:none">⏸</button>
        <button type="button" id="mute-btn" aria-label="Mute" draggable="false" style="touch-action:none">🔊</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
